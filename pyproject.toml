[project]
name = "ai-innovation-practice"
version = "0.1.0"
description = "AI-powered career development and interview guidance platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.6.0",
    "pymysql>=1.1.0",
    "cryptography>=41.0.0,<42",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32.0",
    "pyjwt>=2.15.1",
    "passlib[bcrypt]>=1.7.4",
    # passlib 1.7.4 通过 bcrypt.__about__.__version__ 读取版本，
    # bcrypt 4.1 起移除了该属性，会打印 "(trapped) error reading bcrypt version"。
    # 锁在 4.0.x 是 passlib 停更下的唯一干净组合。
    "bcrypt>=4.0.1,<4.1.0",
    "slowapi>=0.1.9",
    "openai>=3.45.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "import-linter>=2.3.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "ruff>=0.17.1",
]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Application layers"
type = "layers"
layers = [
    "app.api",
    "app.services",
    "app.repositories",
    "app.integrations",
]

[[tool.importlinter.contracts]]
name = "Services cannot depend on FastAPI"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["fastapi"]

[[tool.importlinter.contracts]]
name = "API cannot depend on repositories"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.repositories"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "API cannot depend on integrations"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.integrations"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Repositories cannot depend on services"
type = "forbidden"
source_modules = ["app.repositories"]
forbidden_modules = ["app.services"]

[tool.ruff]
line-length = 100
target-version = "py313"
# `docs/` 是决策记录，不是源码：`ruff format` 会顺带格式化 Markdown 里围栏的
# Python 代码块（0.15 起的 Markdown 支持），把 ADR 的示例代码重排成「今天的风格」。
# 历史文档应保持写入时的样子，因此整目录排除，避免每次格式化都改到 ADR。
extend-exclude = ["docs/"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_configs = true
exclude = "tests/test_(migrations|resumes_generate)\\.py"

[tool.pytest.ini_options]
# `scripts/tests` 是 G4 令牌闸自己的用例（`unittest` 形态）：它测的是脚本能不能红，
# 不连数据库。**必须一起收集**，否则「闸有测试」只写在纸上——CI 跑的是 `pytest -q`，
# 漏掉这个目录等于给自己发一张从未执行的通过证书。
testpaths = ["tests", "scripts/tests"]
pythonpath = ["."]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
