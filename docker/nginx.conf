# NOT VERIFIED: Docker is not installed on the development host.
# Served by Dockerfile.frontend. Mirrors what the Vite dev server does locally
# (frontend/vite.config.ts:17-19 proxies /api to the backend), so the SPA needs no
# backend host configuration in either mode.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Matches MAX_UPLOAD_MB=10 in .env.example; a larger upload is rejected by nginx
    # before it ever reaches FastAPI.
    client_max_body_size 10m;

    # The SPA calls /api/v1/... on its own origin (frontend/src/api/client.ts:160),
    # so no CORS exception is needed on the backend for this topology.
    # `proxy_pass` has no trailing URI on purpose: nginx then forwards the original
    # path, and the backend router is mounted under /api/v1.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # vue-router runs in history mode (frontend/src/router/index.ts:51), so a deep
    # link such as /resumes/123 has to fall back to the SPA entry document.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
