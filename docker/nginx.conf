# NOT VERIFIED: Docker is not installed on the development host.
# Served by Dockerfile.frontend. Mirrors what the Vite dev server does locally
# (frontend/vite.config.ts:17-19 proxies /api to the backend), so the SPA needs no
# backend host configuration in either mode.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 10m here is deliberately larger than the app's own cap so multipart overhead
    # cannot trip it: the real limit is `MAX_PDF_BYTES = 5 MiB` in
    # app/services/resume_import.py (enforced while streaming, with a 422 +
    # `PDF_TOO_LARGE` the UI can explain). An earlier revision of this comment cited
    # `MAX_UPLOAD_MB=10` from .env.example as the basis — that variable is read by
    # nothing (checked round 33), so do not re-point this line at it.
    # If you front this with your own proxy, YOUR proxy's body limit is the effective
    # one; a too-small value shows up as a 413 that never reaches FastAPI.
    client_max_body_size 10m;

    # The SPA calls /api/v1/... on its own origin (frontend/src/api/client.ts:160),
    # so no CORS exception is needed on the backend for this topology.
    # `proxy_pass` has no trailing URI on purpose: nginx then forwards the original
    # path, and the backend router is mounted under /api/v1.
    #
    # `backend` resolves in BOTH topologies, but by two different mechanisms:
    #   - docker-compose.yml (dev): the API service is literally named `backend`.
    #   - docker-compose.prod.yml: the service is named `web`, and carries a network
    #     alias `backend` for exactly this line. Remove that alias and every /api/
    #     request 502s while `docker compose ps` stays green.
    # If the alias ever fails on a real host, change this line to `http://web:8000`
    # and rename the dev service to `web` — do not leave two nginx.conf variants.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # vue-router runs in history mode (frontend/src/router/index.ts:51), so a deep
    # link such as /resumes/123 has to fall back to the SPA entry document.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
