name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: resume_mvp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:test@127.0.0.1:3306/resume_mvp_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4

      # 2026-11-08 老板裁定的升级（原话「升级到 setup-uv@v7.6.0 或更高」，实测最新是 v10.3.3）。
      # 挡的是什么：`v4` 这个 action 跑在 Node 20 上，被 runner 强制切到 Node 24 并天天告警；
      # 更要命的是它下载 uv/CPython 的那条路径没有带 `github.token`、也没有重试，
      # 于是 GitHub 侧一发 504 就整条 CI 红——2026-11-08 连红三轮、失败步全是
      # `Run astral-sh/setup-uv@v4` / `Install dependencies`，而**同一条 commit 的另一侧全绿**
      # （`on: push` 与 `on: pull_request` 各跑一次，所以是两条 run，不是矩阵）。
      #
      # `python-version: "3.13"` 才是去掉那个下载面的关键：`pyproject.toml` 写
      # `requires-python = ">=3.13"`，而 runner 镜像的系统 Python 是 3.12，
      # 所以 `uv sync` 每次都得自己去 `github.com/astral-sh/python-build-standalone`
      # 拉一个托管 CPython（日志里 504 的正是这个 URL）。让 setup-uv 用带 token 与重试的
      # 路径把 3.13 装好并设 `UV_PYTHON`，`uv sync` 就不再有那条网络请求。
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.9.13"
          python-version: "3.13"

      # GitHub Actions uses public PyPI; local development uses the configured mirror.
      - name: Install dependencies
        run: uv sync

      # 格式化闸。基线是 c9f935a 那一次全仓 `ruff format`，所以这一步从上线那天起就是绿的：
      # 它挡的是**此后**新提交的风格发散，不是替历史债还钱。
      # 版本由 uv.lock 钉住，不会出现「本地 ruff 与 CI ruff 判得不一样」这种扯皮。
      - name: Format check
        # scripts/ 一起进来：种子脚本落在仓库里就必须和 app/ 同标准，
        # 否则等于开一个没人检查的目录（ADR-013 §9）。
        run: uv run ruff format --check app tests alembic scripts

      - name: Lint
        run: uv run ruff check app tests scripts

      - name: Type check
        run: uv run mypy app scripts

      - name: Import architecture check
        run: uv run lint-imports

      # 文档里的 `路径:行号` 引用必须还能指到真实代码。ADR-013 §10 第 10 步曾用一次性脚本机械平移，
      # 结果写出 12 处「首行是空行」的引用，而我在交付说明里声明过「全部指向非空行」——
      # 声明不算检查，这一步才是（AGENTS.md §7.6）。
      - name: Docs citation check
        run: uv run python scripts/check_docs_citations.py

      # test_migrations covers upgrade/downgrade against the MySQL service.
      - name: Test and migration check
        run: uv run pytest -q

      # Node 22 matches the local development version (v22.x), so a green run here
      # means the same thing it means on a developer machine.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # The lockfile lives in frontend/, not at the repo root; without this the
          # cache lookup fails before npm runs.
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend lint
        # ADR-012: this step did not exist before, while package.json advertised a
        # `lint` script that ESLint 9 could not run (no flat config in the repo).
        run: npm run lint
        working-directory: frontend

      - name: Frontend unit tests
        run: npm run test
        working-directory: frontend

      - name: Frontend type check
        run: npm run typecheck
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend
