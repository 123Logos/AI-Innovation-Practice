name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: resume_mvp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:test@127.0.0.1:3306/resume_mvp_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.9.13"

      # GitHub Actions uses public PyPI; local development uses the configured mirror.
      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check app tests

      - name: Type check
        run: uv run mypy app

      - name: Import architecture check
        run: uv run lint-imports

      # test_migrations covers upgrade/downgrade against the MySQL service.
      - name: Test and migration check
        run: uv run pytest -q
