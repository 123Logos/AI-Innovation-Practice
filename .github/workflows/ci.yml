name: CI

# 2026-11-08 老板裁定删掉 `push` 触发。原来 `push`（不限分支）与 `pull_request` 命中同一个单 job，
# 所以推一次特性分支会跑两条内容完全相同的 run——那不是矩阵，是两个事件各触发一次。
#
# 删掉后 master 依然有绿保证，判据不在这份 yaml 里，在仓库 ruleset 26754995
# 「master: 只能经 PR 合入且 CI 必须绿」：`pull_request` + `test` 状态检查 +
# `strict_required_status_checks_policy: true`（合入前源分支必须先更新到 master）。
# 于是每个进 master 的提交，其内容树都等于一条已经跑绿的 SHA，`push` 触发不提供额外保证。
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: resume_mvp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:test@127.0.0.1:3306/resume_mvp_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4

      # 2026-11-08 老板裁定的升级（原话「升级到 setup-uv@v7.6.0 或更高」，实测最新 v10.3.3）：
      # v4 这个 action 跑在 Node 20 上、被 runner 强制切 24 并天天告警，新版下载 uv 时带 token 与重试。
      # 但**升级本身没有挡住那条 504**——我先以为 setup-uv 的 `python-version` 会把 Python 装好，
      # 那是错的（README 原文：它只是「set UV_PYTHON to」）。`146b249` 那两条 run 的日志原文：
      #
      #   error: Request failed after 3 retries
      #     Caused by: Failed to download https://github.com/astral-sh/python-build-standalone/…
      #     Caused by: HTTP status server error (504 Gateway Timeout)
      #
      # 真正去掉这条网络请求的是下面两步的组合：`actions/setup-python` 从 GitHub 自己的分发装 3.13，
      # `UV_PYTHON_PREFERENCE=only-system` 则**禁止 uv 去下载托管 CPython**。
      # 判 `only-system` 而不是 `system`：后者仍会在找不到时回落下载，那就等于没改。
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.9.13"
          python-version: "3.13"

      # GitHub Actions uses public PyPI; local development uses the configured mirror.
      - name: Install dependencies
        env:
          UV_PYTHON_PREFERENCE: only-system
        run: uv sync

      # 格式化闸。基线是 c9f935a 那一次全仓 `ruff format`，所以这一步从上线那天起就是绿的：
      # 它挡的是**此后**新提交的风格发散，不是替历史债还钱。
      # 版本由 uv.lock 钉住，不会出现「本地 ruff 与 CI ruff 判得不一样」这种扯皮。
      - name: Format check
        # scripts/ 一起进来：种子脚本落在仓库里就必须和 app/ 同标准，
        # 否则等于开一个没人检查的目录（ADR-013 §9）。
        run: uv run ruff format --check app tests alembic scripts

      - name: Lint
        run: uv run ruff check app tests scripts

      - name: Type check
        run: uv run mypy app scripts

      - name: Import architecture check
        run: uv run lint-imports

      # 文档里的 `路径:行号` 引用必须还能指到真实代码。ADR-013 §10 第 10 步曾用一次性脚本机械平移，
      # 结果写出 12 处「首行是空行」的引用，而我在交付说明里声明过「全部指向非空行」——
      # 声明不算检查，这一步才是（AGENTS.md §7.6）。
      - name: Docs citation check
        run: uv run python scripts/check_docs_citations.py

      # G1 文案闸（守则 C1/C2 + §9 G1，老板 2026-11-09 第 4 点批准进 CI）：emoji、被当图标用的
      # 符号、开发者黑话不许上屏，豁免必须带理由。与上一条同形态——stdlib-only 的纯文本检查，
      # 所以放在这里跑，不进 pytest（`tests/conftest.py` 会连真实 MySQL，见脚本 docstring）。
      # 覆盖范围**只有前端**：后端上屏字符串属批次 F1c（`docs/ROADMAP.md` §3 X2）。
      - name: UI copy check (G1)
        run: uv run python scripts/check_ui_copy.py

      # G3 错误文案表（守则 C3 + §9 G3，老板 2026-11-11 第 13 轮批准，原话「G3（错误文案表）：
      # 随 F1c 的落地一起进」）。G1 只扫前端，`app/` 那侧曾经是 `message = str(exc.detail)`
      # ——路由里任何一条英文 detail 都会裸上屏，而 G1 看不见（ROADMAP §3 X2）。这一步守的是
      # 「上屏那句话只能来自 app/core/error_messages.py 那张表」，并且机械钉住出口真的接在表上。
      - name: Error copy check (G3)
        run: uv run python scripts/check_error_copy.py

      # G5 路由可达性（守则 L6 + §9 G5，老板 2026-11-11 第 13 轮批准进 CI，原话
      # 「立刻接进 CI，但必须带上守则 §11 的豁免名单…它如果不能机械守门，写在脚本里就毫无意义」）。
      # 名单在脚本里显式维护，首当其冲就是 DashboardView.vue——老板点名「纳入路由，不要删」的
      # 规划期资产，归批次 F7。名单本身也防腐：豁免项在磁盘上消失同样报红。
      - name: Route reachability check (G5)
        run: uv run python scripts/check_route_reachability.py

      # G4 令牌检查（守则 T1/T2 + §9 G4，同一轮批准）：组件样式里不许有裸 hex 与裸 px 字号。
      # 与 T1 的存量替换同批上线——第一次运行扫出 205 处，全部换成令牌后归零，
      # 没有一处靠注释豁免。豁免名单在脚本里显式维护：纸面（.paper）、打印稿（@media print）、
      # 令牌定义本身（:root）、--paper-* 色板，四类都是「必须固定值」的地方。
      - name: Design token check (G4)
        run: uv run python scripts/check_design_tokens.py

      # test_migrations covers upgrade/downgrade against the MySQL service.
      - name: Test and migration check
        run: uv run pytest -q

      # Node 22 matches the local development version (v22.x), so a green run here
      # means the same thing it means on a developer machine.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # The lockfile lives in frontend/, not at the repo root; without this the
          # cache lookup fails before npm runs.
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend lint
        # ADR-012: this step did not exist before, while package.json advertised a
        # `lint` script that ESLint 9 could not run (no flat config in the repo).
        run: npm run lint
        working-directory: frontend

      - name: Frontend unit tests
        run: npm run test
        working-directory: frontend

      - name: Frontend type check
        run: npm run typecheck
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend
